variables:
  Registry: "pgtgs/"
  Image: "tgs-production"

stages:
  - build
  - deploy

docker_build:
  stage: build
  script:
    - docker info
    - docker login --username $docker_user --password $docker_pwd
    - export TAG=$(date +%Y-%m%d-%H%M)
    - echo $TAG > tag.txt
    - docker build -t ${Registry}${Image}:${TAG} .
    - docker push ${Registry}${Image}:${TAG}
  artifacts:
    paths:
      - tag.txt
  only:
    - master
    - release/current

.deploy_template: &deploy_template
  stage: deploy
  image:
    name: bitnami/kubectl:1.30
    entrypoint: [""]
  before_script:
    - TAG=$(cat tag.txt)
  script:
    - kubectl set image deployment/${Image} ${Image}=${Registry}${Image}:${TAG} --record -n ${CI_ENVIRONMENT_NAME}
  dependencies:
    - docker_build

deploy-staging:
  <<: *deploy_template
  tags:
    - staging
  variables:
    CI_ENVIRONMENT_NAME: staging
  only:
    - release/current

deploy-prod:
  <<: *deploy_template
  tags:
    - prod
  variables:
    CI_ENVIRONMENT_NAME: prod
  when: manual
  only:
    - master
